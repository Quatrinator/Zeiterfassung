# Example ONLY for your existing external HTTPS proxy, not the application nginx.
# Put this location inside its existing TLS server block. Certificates stay there.
# Replace 127.0.0.1:8080 with the privately reachable application host when needed.
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # This example assumes this is the sole internet-facing proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
}
